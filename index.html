<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Track daily expenses and visualize spending patterns by category">
    <title>Expense & Budget Visualizer</title>
    
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    
    <!-- Styles -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="container">
        <!-- Theme Toggle Button -->
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to dark theme" tabindex="0">
            <span class="theme-icon">🌙</span>
        </button>

        <!-- Total Balance Display -->
        <section class="balance-section" aria-labelledby="balance-heading">
            <h1 id="balance-heading">Total Expense</h1>
            <div id="total-balance" class="balance-amount" aria-live="polite">Rp 0,00</div>
        </section>

        <!-- Input Form -->
        <section class="form-section" aria-labelledby="form-heading">
            <h2 id="form-heading">Add Expense</h2>
            <form id="expense-form" novalidate>
                <div class="form-group">
                    <label for="item-name">Item Name</label>
                    <input 
                        type="text" 
                        id="item-name" 
                        name="itemName" 
                        placeholder="Enter item name"
                        aria-required="true"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="amount">Amount</label>
                    <input 
                        type="number" 
                        id="amount" 
                        name="amount" 
                        placeholder="0.00"
                        step="0.01"
                        min="0.01"
                        aria-required="true"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select 
                        id="category" 
                        name="category"
                        aria-required="true"
                        required
                    >
                        <option value="">Select a category</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Fun">Fun</option>
                    </select>
                </div>

                <button type="submit" class="btn-submit">Add Expense</button>

                <div id="error-message" class="error-message" role="alert" aria-live="assertive"></div>
            </form>
        </section>

        <!-- Custom Category Management -->
        <section class="category-management-section" aria-labelledby="category-management-heading">
            <h2 id="category-management-heading">Manage Categories</h2>

            <div class="category-add-form">
                <div class="form-group">
                    <label for="new-category-name">New Category Name</label>
                    <input
                        type="text"
                        id="new-category-name"
                        name="newCategoryName"
                        placeholder="Enter category name"
                        maxlength="20"
                        aria-describedby="category-count"
                    >
                </div>
                <button type="button" id="add-category-btn" class="btn-add-category">Add Category</button>
            </div>

            <div id="category-count" class="category-count" aria-live="polite">0/10 custom categories</div>

            <ul id="custom-category-list" class="custom-category-list" aria-live="polite">
                <!-- Custom categories will be dynamically inserted here -->
            </ul>
        </section>

        <!-- Transaction List -->
        <section class="transactions-section" aria-labelledby="transactions-heading">
            <h2 id="transactions-heading">Transaction History</h2>
            
            <!-- Sort Controls -->
            <div class="sort-controls" role="group" aria-label="Transaction sorting options">
                <div class="sort-field-group">
                    <label for="sort-field">Sort by</label>
                    <select id="sort-field" name="sortField" aria-label="Sort field">
                        <option value="date">Date</option>
                        <option value="amount">Amount</option>
                        <option value="category">Category</option>
                    </select>
                </div>
                
                <button type="button" id="sort-order-toggle" class="btn-sort-order" aria-label="Sort order: Descending">
                    <span class="sort-order-icon">↓</span>
                    <span class="sort-order-text">Descending</span>
                </button>
            </div>

            <ul id="transaction-list" class="transaction-list" aria-live="polite">
                <!-- Transactions will be dynamically inserted here -->
            </ul>
        </section>

        <!-- Chart Visualization -->
        <section class="chart-section" aria-labelledby="chart-heading">
            <h2 id="chart-heading">Spending by Category</h2>
            <div class="chart-container">
                <canvas id="spending-chart" aria-label="Pie chart showing spending distribution by category"></canvas>
            </div>
        </section>
    </main>

    <!-- Application Script -->
    <script src="js/app.js"></script>
</body>
</html>
